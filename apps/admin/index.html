<!doctype html>
<html lang="en">
  <head>
    <!-- The theme fonts, for the theme previews in the game form and the recap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hind:wght@700&family=Press+Start+2P&family=Righteous&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Grand City Race</title>
    <!-- A host's chosen appearance, set before anything draws (see src/utils/appearance.ts) -->
    <script>
      try {
        const theme = localStorage.getItem('gcr-appearance');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
