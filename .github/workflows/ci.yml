name: CI

on:
  pull_request:
    branches: [main]
  push:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The shared package has no build of its own: each app type-checks it
      # as part of its own sources
      - name: Typecheck functions
        run: npm run typecheck --workspace=apps/functions

      - name: Typecheck app
        run: npx tsc --noEmit -p apps/mobile

      - name: Typecheck console
        run: npm run typecheck --workspace=apps/admin

      - name: Lint console
        run: npm run lint --workspace=apps/admin

      - name: Build functions
        run: npm run build --workspace=apps/functions

      # The app's quest screens built for the web, for the console's phone preview
      - name: Build phone preview
        run: npm run build:preview --workspace=apps/mobile

      - name: Build console
        # Vite replaces VITE_* at build time — dummy values are enough for a compile check
        run: npm run build --workspace=apps/admin
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator needs Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci && npm install --global firebase-tools@15.11.0

      - name: Security rules
        run: firebase emulators:exec --project rules-test --config firebase.rules-test.json "node local/rules-test.mjs"

      - name: Server functions
        run: |
          npm run build --workspace=apps/functions
          firebase emulators:exec --only auth,firestore,functions --project demo-gcr "node local/functions-test.mjs"
